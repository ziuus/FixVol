name: FixVol Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create GitHub Releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      # ── Optional: sign the APK if secrets are configured ──────────────────
      # To enable signing, add these secrets in your repo settings:
      #   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      - name: Sign APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        uses: r0adkll/sign-android-release@v1
        id: sign_apk
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK for release
        run: |
          VERSION="${GITHUB_REF_NAME}"
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED="${{ steps.sign_apk.outputs.signedReleaseFile }}"

          # Use signed APK if signing ran, otherwise fall back to unsigned
          SOURCE="${SIGNED:-$UNSIGNED}"
          DEST="FixVol-${VERSION}.apk"

          cp "$SOURCE" "$DEST"
          echo "APK_PATH=$DEST" >> $GITHUB_ENV

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"   # strip leading 'v'
          NOTES=$(awk "/^## \[$VERSION\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="Release $GITHUB_REF_NAME"
          fi
          echo "$NOTES" > release_notes.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "FixVol ${{ github.ref_name }}"
          body_path: release_notes.txt
          files: ${{ env.APK_PATH }}
          draft: false
          prerelease: false
